<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>群莘戰隊</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background: #f5f7fb;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      padding: 70px 20px 50px;

      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .header {
      text-align: center;
      margin-bottom: 42px;
    }

    .header h1 {
      margin: 0;

      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .header p {
      margin: 16px 0 0;

      font-size: 23px;
      color: #777;
    }

    .card {
      background: white;

      border-radius: 30px;

      padding: 34px 28px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.06);
    }

    .field {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      height: 74px;

      border:
        2px solid #dedede;

      border-radius: 22px;

      padding: 0 25px;

      font-size: 23px;

      outline: none;

      background: white;
      color: #111;
    }

    input:focus {
      border-color: #172033;
    }

    input::placeholder {
      color: #aaa;
    }

    button {
      width: 100%;
      height: 74px;

      border: none;
      border-radius: 22px;

      font-size: 24px;
      font-weight: 700;

      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;

      margin-top: 6px;
    }

    .primary:active {
      transform: scale(0.99);
    }

    .secondary {
      background: #e9eef8;
      color: #172957;

      margin-top: 20px;
    }

    .back-btn {
      background: transparent;
      color: #777;

      margin-top: 12px;
    }

    .message {
      margin-top: 28px;

      padding: 0 10px;

      text-align: center;

      font-size: 20px;
      line-height: 1.6;

      display: none;
    }

    .message.error {
      display: block;
      color: #d84035;
    }

    .message.success {
      display: block;
      color: #159447;
    }

    .message.info {
      display: block;
      color: #555;
    }

    .setup-title {
      font-size: 36px;
      font-weight: 800;

      margin-bottom: 20px;
    }

    .setup-description {
      font-size: 22px;

      line-height: 1.55;

      color: #777;

      margin-bottom: 30px;
    }

    .home {
      text-align: center;
    }

    .home-title {
      font-size: 36px;
      font-weight: 800;

      margin-bottom: 10px;
    }

    .member-name {
      font-size: 28px;

      color: #172957;

      font-weight: 700;

      margin: 20px 0;
    }

    .member-info {
      background: #f5f7fb;

      border-radius: 22px;

      padding: 20px;

      text-align: left;

      font-size: 19px;

      line-height: 1.8;

      margin-bottom: 25px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      opacity: 0.6;

      pointer-events: none;
    }

    @media (max-width: 480px) {

      .page {
        padding: 60px 18px 40px;
      }

      .header h1 {
        font-size: 36px;
      }

      .header p {
        font-size: 20px;
      }

      .card {
        padding: 28px 22px;

        border-radius: 28px;
      }

      input {
        height: 68px;

        font-size: 21px;
      }

      button {
        height: 68px;

        font-size: 22px;
      }

      .setup-title {
        font-size: 32px;
      }

    }

  </style>

</head>

<body>

<div class="page">

  <div class="container">


    <!-- ================================================= -->
    <!-- 登入 -->
    <!-- ================================================= -->

    <div id="loginPage">

      <div class="header">

        <h1>群莘戰隊</h1>

        <p>
          南山人壽・業務活動管理
        </p>

      </div>


      <div class="card">

        <div class="field">

          <input
            id="loginAgcode"
            type="text"
            inputmode="numeric"
            placeholder="請輸入 AG Code"
            autocomplete="username"
          >

        </div>


        <div class="field">

          <input
            id="loginPassword"
            type="password"
            placeholder="請輸入密碼"
            autocomplete="current-password"
          >

        </div>


        <button
          id="loginButton"
          class="primary"
          onclick="login()"
        >
          登入
        </button>


        <button
          class="secondary"
          onclick="showSetupPage()"
        >
          第一次使用 / 設定密碼
        </button>


        <div
          id="loginMessage"
          class="message"
        ></div>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- 第一次使用 -->
    <!-- ================================================= -->

    <div
      id="setupPage"
      class="hidden"
    >

      <div class="header">

        <h1>群莘戰隊</h1>

        <p>
          第一次使用
        </p>

      </div>


      <div class="card">

        <div class="setup-title">
          設定您的登入密碼
        </div>


        <div class="setup-description">

          請輸入您的 AG Code 與 Email。<br>

          系統會自動確認您的辦公室資料。

        </div>


        <div class="field">

          <input
            id="setupAgcode"
            type="text"
            inputmode="numeric"
            placeholder="請輸入 AG Code"
            autocomplete="username"
          >

        </div>


        <div class="field">

          <input
            id="setupEmail"
            type="email"
            placeholder="請輸入 Email"
            autocomplete="email"
          >

        </div>


        <div class="field">

          <input
            id="setupPassword"
            type="password"
            placeholder="請設定密碼"
            autocomplete="new-password"
          >

        </div>


        <div class="field">

          <input
            id="setupPassword2"
            type="password"
            placeholder="請再次輸入密碼"
            autocomplete="new-password"
          >

        </div>


        <button
          id="setupButton"
          class="primary"
          onclick="setupAccount()"
        >
          完成設定
        </button>


        <button
          class="back-btn"
          onclick="showLoginPage()"
        >
          ← 返回登入
        </button>


        <div
          id="setupMessage"
          class="message"
        ></div>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- 首頁 -->
    <!-- ================================================= -->

    <div
      id="homePage"
      class="hidden"
    >

      <div class="header">

        <h1>群莘戰隊</h1>

        <p>
          南山人壽・業務活動管理
        </p>

      </div>


      <div class="card home">

        <div class="home-title">
          歡迎回來
        </div>


        <div
          id="memberName"
          class="member-name"
        >
          載入中...
        </div>


        <div
          id="memberInfo"
          class="member-info"
        ></div>


        <button
          class="primary"
          onclick="logout()"
        >
          登出
        </button>

      </div>

    </div>


  </div>

</div>


<script>

/* =====================================================
   Supabase
   ===================================================== */

const SUPABASE_URL =
  "https://frtrmqakzsawbzrtkdgp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cBszHnxSkX5vGKnOZ9H1Kg_fmCMND0q";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        autoRefreshToken: true,
        persistSession: true,
        detectSessionInUrl: true
      }
    }
  );


/* =====================================================
   頁面
   ===================================================== */

function showLoginPage() {

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("setupPage")
    .classList.add("hidden");

  document
    .getElementById("homePage")
    .classList.add("hidden");

  clearMessages();
}


function showSetupPage() {

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("setupPage")
    .classList.remove("hidden");

  document
    .getElementById("homePage")
    .classList.add("hidden");

  clearMessages();
}


function showHomePage() {

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("setupPage")
    .classList.add("hidden");

  document
    .getElementById("homePage")
    .classList.remove("hidden");

  clearMessages();
}


/* =====================================================
   清除訊息
   ===================================================== */

function clearMessages() {

  [
    "loginMessage",
    "setupMessage"
  ].forEach(id => {

    const element =
      document.getElementById(id);

    if (!element) return;

    element.textContent = "";

    element.className =
      "message";

  });

}


/* =====================================================
   顯示訊息
   ===================================================== */

function showMessage(
  elementId,
  message,
  type = "error"
) {

  const element =
    document.getElementById(elementId);

  if (!element) return;

  element.textContent =
    message;

  element.className =
    "message " + type;

}


/* =====================================================
   清理資料
   ===================================================== */

function cleanAgcode(value) {

  return String(value || "")
    .trim();

}


function cleanEmail(value) {

  return String(value || "")
    .trim()
    .toLowerCase();

}


/* =====================================================
   第一次使用
   ===================================================== */

async function setupAccount() {

  const button =
    document.getElementById(
      "setupButton"
    );


  const agcode =
    cleanAgcode(
      document.getElementById(
        "setupAgcode"
      ).value
    );


  const email =
    cleanEmail(
      document.getElementById(
        "setupEmail"
      ).value
    );


  const password =
    document.getElementById(
      "setupPassword"
    ).value;


  const password2 =
    document.getElementById(
      "setupPassword2"
    ).value;


  if (!agcode) {

    showMessage(
      "setupMessage",
      "請輸入 AG Code"
    );

    return;
  }


  if (!email) {

    showMessage(
      "setupMessage",
      "請輸入 Email"
    );

    return;
  }


  if (!password) {

    showMessage(
      "setupMessage",
      "請設定密碼"
    );

    return;
  }


  if (password.length < 6) {

    showMessage(
      "setupMessage",
      "密碼至少需要 6 碼"
    );

    return;
  }


  if (password !== password2) {

    showMessage(
      "setupMessage",
      "兩次輸入的密碼不一致"
    );

    return;
  }


  button.classList.add("loading");

  button.textContent =
    "確認資料中...";


  try {

    /* =================================================
       ① 查詢辦公室名單
       ================================================= */

    const {
      data: allowedUser,
      error: allowedError
    } =
      await supabaseClient
        .from("allowed_ag_codes")
        .select(
          "AGcode,name,email,enable,registered"
        )
        .eq("AGcode", agcode)
        .maybeSingle();


    if (allowedError) {

      throw new Error(
        "讀取辦公室資料失敗：" +
        allowedError.message
      );

    }


    if (!allowedUser) {

      throw new Error(
        "找不到此 AG Code，請確認輸入是否正確。"
      );

    }


    if (allowedUser.enable === false) {

      throw new Error(
        "此 AG Code 目前尚未啟用，請洽辦公室。"
      );

    }


    const registeredEmail =
      cleanEmail(
        allowedUser.email
      );


    if (!registeredEmail) {

      throw new Error(
        "此 AG Code 尚未設定辦公室 Email。"
      );

    }


    if (registeredEmail !== email) {

      throw new Error(
        "AG Code 與 Email 不符合，請確認資料是否正確。"
      );

    }


    /* =================================================
       ② 建立 Auth
       ================================================= */

    button.textContent =
      "建立帳號...";


    const {
      data: signUpData,
      error: signUpError
    } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {

            agcode: agcode,

            name:
              allowedUser.name || ""

          }

        }

      });


    if (signUpError) {

      console.error(
        "SIGN UP ERROR:",
        signUpError
      );

      throw new Error(
        signUpError.message
      );

    }


    const user =
      signUpData.user;


    const session =
      signUpData.session;


    if (!user) {

      throw new Error(
        "帳號建立失敗。"
      );

    }


    /* =================================================
       Email 驗證開啟
       ================================================= */

    if (!session) {

      showMessage(
        "setupMessage",
        "帳號已建立！請先到 Email 收取驗證信並完成驗證，再重新登入。",
        "success"
      );

      button.classList.remove(
        "loading"
      );

      button.textContent =
        "完成設定";

      return;

    }


    /* =================================================
       ③ 建立 / 修復 profiles
       ================================================= */

    button.textContent =
      "建立會員資料...";


    await createOrRepairProfile(
      user,
      allowedUser,
      email,
      agcode
    );


    /* =================================================
       ④ 標記 registered
       ================================================= */

    await supabaseClient
      .from("allowed_ag_codes")
      .update({
        registered: true
      })
      .eq("AGcode", agcode);


    /* =================================================
       ⑤ 直接進首頁
       ================================================= */

    showMessage(
      "setupMessage",
      "設定完成！",
      "success"
    );


    setTimeout(
      () => {

        loadMemberAndShowHome();

      },
      300
    );


  } catch (error) {

    console.error(
      "SETUP ERROR:",
      error
    );


    showMessage(
      "setupMessage",
      error.message ||
      "設定失敗，請稍後再試。"
    );


  } finally {

    button.classList.remove(
      "loading"
    );

    button.textContent =
      "完成設定";

  }

}


/* =====================================================
   建立 / 修復 profiles

   使用 upsert
   避免會員資料已經存在時出錯
   ===================================================== */

async function createOrRepairProfile(
  user,
  allowedUser,
  email,
  agcode
) {

  const profile = {

    id: user.id,

    agcode: agcode,

    name:
      allowedUser.name ||
      user.user_metadata?.name ||
      "",

    email: email,

    level: 1,

    xp: 0

  };


  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .upsert(
        profile,
        {
          onConflict: "id"
        }
      );


  if (error) {

    console.error(
      "PROFILE UPSERT ERROR:",
      error
    );

    throw new Error(
      "會員資料建立失敗：" +
      error.message
    );

  }

}


/* =====================================================
   登入
   ===================================================== */

async function login() {

  const button =
    document.getElementById(
      "loginButton"
    );


  const agcode =
    cleanAgcode(
      document.getElementById(
        "loginAgcode"
      ).value
    );


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if (!agcode) {

    showMessage(
      "loginMessage",
      "請輸入 AG Code"
    );

    return;
  }


  if (!password) {

    showMessage(
      "loginMessage",
      "請輸入密碼"
    );

    return;
  }


  button.classList.add(
    "loading"
  );

  button.textContent =
    "登入中...";


  try {

    /* =================================================
       ① AG Code → Email
       ================================================= */

    const {
      data: allowedUser,
      error: allowedError
    } =
      await supabaseClient
        .from("allowed_ag_codes")
        .select(
          "AGcode,name,email,enable"
        )
        .eq("AGcode", agcode)
        .maybeSingle();


    if (allowedError) {

      console.error(
        "ALLOWED ERROR:",
        allowedError
      );

      throw new Error(
        "讀取 AG Code 資料失敗：" +
        allowedError.message
      );

    }


    if (!allowedUser) {

      throw new Error(
        "找不到此 AG Code。"
      );

    }


    if (allowedUser.enable === false) {

      throw new Error(
        "此 AG Code 目前尚未啟用。"
      );

    }


    const email =
      cleanEmail(
        allowedUser.email
      );


    if (!email) {

      throw new Error(
        "此 AG Code 沒有設定 Email。"
      );

    }


    /* =================================================
       ② Auth 登入
       ================================================= */

    const {
      data: loginData,
      error: loginError
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


    if (loginError) {

      console.error(
        "LOGIN ERROR:",
        loginError
      );

      throw new Error(
        "登入失敗，請確認 AG Code 或密碼是否正確。"
      );

    }


    const user =
      loginData.user;


    if (!user) {

      throw new Error(
        "登入失敗，沒有取得使用者資料。"
      );

    }


    /* =================================================
       ③ 登入後檢查 profiles
       ================================================= */

    await loadMemberAndShowHome(
      allowedUser,
      agcode,
      email,
      false
    );


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );


    showMessage(
      "loginMessage",
      error.message ||
      "登入失敗，請稍後再試。"
    );


  } finally {

    button.classList.remove(
      "loading"
    );

    button.textContent =
      "登入";

  }

}


/* =====================================================
   取得會員資料

   這裡是這次最重要的修正
   ===================================================== */

async function loadMemberAndShowHome(
  allowedUser = null,
  agcode = null,
  email = null,
  logoutOnFailure = false
) {

  try {

    /* =================================================
       ① 取得 Auth user
       ================================================= */

    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth
        .getUser();


    if (userError) {

      throw new Error(
        "Auth 使用者讀取失敗：" +
        userError.message
      );

    }


    if (!user) {

      throw new Error(
        "目前沒有登入的帳號。"
      );

    }


    /* =================================================
       ② 查 profiles
       ================================================= */

    let {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "id,agcode,name,email,level,xp,created_at"
        )
        .eq("id", user.id)
        .maybeSingle();


    /* =================================================
       ③ 如果 profiles 沒有資料
          嘗試自動修復
       ================================================= */

    if (!profile && !profileError) {

      console.log(
        "找不到 profiles，嘗試自動修復..."
      );


      const userAgcode =
        agcode ||
        user.user_metadata?.agcode;


      const userEmail =
        email ||
        user.email;


      if (!userAgcode) {

        throw new Error(
          "找不到會員 AG Code，無法建立會員資料。"
        );

      }


      if (!allowedUser) {

        const {
          data: allowedData,
          error: allowedDataError
        } =
          await supabaseClient
            .from("allowed_ag_codes")
            .select(
              "AGcode,name,email,enable"
            )
            .eq("AGcode", userAgcode)
            .maybeSingle();


        if (allowedDataError) {

          throw new Error(
            "讀取會員名單失敗：" +
            allowedDataError.message
          );

        }


        allowedUser =
          allowedData;

      }


      if (!allowedUser) {

        throw new Error(
          "找不到對應的辦公室會員資料。"
        );

      }


      await createOrRepairProfile(
        user,
        allowedUser,
        userEmail,
        userAgcode
      );


      /* 再查一次 */

      const {
        data: repairedProfile,
        error: repairedError
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,agcode,name,email,level,xp,created_at"
          )
          .eq("id", user.id)
          .maybeSingle();


      if (repairedError) {

        throw new Error(
          "會員資料修復後讀取失敗：" +
          repairedError.message
        );

      }


      profile =
        repairedProfile;

    }


    /* =================================================
       如果真的有 RLS / DB 錯誤
       ================================================= */

    if (profileError) {

      console.error(
        "PROFILE ERROR:",
        profileError
      );

      throw new Error(
        "讀取會員資料失敗：" +
        profileError.message
      );

    }


    if (!profile) {

      throw new Error(
        "找不到會員資料，請重新完成第一次使用設定。"
      );

    }


    /* =================================================
       ④ 顯示會員
       ================================================= */

    document
      .getElementById(
        "memberName"
      )
      .textContent =
      profile.name ||
      "會員";


    document
      .getElementById(
        "memberInfo"
      )
      .innerHTML = `

        <div>
          <strong>AG Code：</strong>
          ${escapeHtml(profile.agcode)}
        </div>

        <div>
          <strong>Email：</strong>
          ${escapeHtml(profile.email)}
        </div>

        <div>
          <strong>等級：</strong>
          ${profile.level ?? 1}
        </div>

        <div>
          <strong>XP：</strong>
          ${profile.xp ?? 0}
        </div>

      `;


    showHomePage();


  } catch (error) {

    console.error(
      "LOAD MEMBER ERROR:",
      error
    );


    /*
     * 只有明確要求時才登出。
     *
     * 不再因為單純 profile 問題
     * 就把 Auth Session 清掉。
     */

    if (logoutOnFailure) {

      await supabaseClient.auth.signOut();

    }


    showLoginPage();


    showMessage(
      "loginMessage",
      error.message ||
      "讀取會員資料失敗。"
    );

  }

}


/* =====================================================
   登出
   ===================================================== */

async function logout() {

  await supabaseClient.auth.signOut();


  document
    .getElementById(
      "loginAgcode"
    )
    .value = "";


  document
    .getElementById(
      "loginPassword"
    )
    .value = "";


  showLoginPage();

}


/* =====================================================
   HTML 安全處理
   ===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   檢查現有 Session

   注意：
   不再搭配 onAuthStateChange 重複執行
   ===================================================== */

async function checkExistingSession() {

  try {

    const {
      data: {
        session
      },
      error
    } =
      await supabaseClient.auth
        .getSession();


    if (error) {

      console.error(
        "SESSION ERROR:",
        error
      );

      showLoginPage();

      return;

    }


    if (session) {

      await loadMemberAndShowHome(
        null,
        null,
        null,
        false
      );

    } else {

      showLoginPage();

    }


  } catch (error) {

    console.error(
      "SESSION CHECK ERROR:",
      error
    );

    showLoginPage();

  }

}


/* =====================================================
   啟動
   ===================================================== */

checkExistingSession();

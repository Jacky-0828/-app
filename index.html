<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>群莘戰隊 App</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin: 20px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e8edf7;
      color: #172554;
    }

    .activity {
      background: #f0f4ff;
      color: #172554;
    }

    .logout {
      background: #eee;
      color: #333;
    }

    .hidden {
      display: none !important;
    }

    .welcome {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .level {
      color: #666;
      margin-bottom: 20px;
    }

    .activity-grid {
      display: grid;
      gap: 10px;
    }

    .points {
      float: right;
      font-weight: 800;
    }

    #message,
    #registerMessage {
      text-align: center;
      margin: 15px 0;
      color: #d33;
      min-height: 24px;
      line-height: 1.6;
    }

    .info {
      color: #777 !important;
      font-size: 14px;
    }

    .success {
      color: #16803c !important;
    }

    .register-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .register-subtitle {
      color: #777;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .back-button {
      background: transparent;
      color: #666;
      padding: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ================================= -->
  <!-- 登入畫面 -->
  <!-- ================================= -->

  <div id="loginPage">

    <div class="logo">
      群莘戰隊
    </div>

    <div class="subtitle">
      南山人壽・業務活動管理
    </div>

    <div class="card">

      <input
        id="agCode"
        type="text"
        inputmode="numeric"
        placeholder="請輸入 AG Code"
      >

      <input
        id="password"
        type="password"
        placeholder="請輸入密碼"
      >

      <button
        class="primary"
        onclick="login()">
        登入
      </button>

      <button
        class="secondary"
        onclick="showRegisterPage()">
        第一次使用／設定密碼
      </button>

      <div id="message"></div>

    </div>

  </div>


  <!-- ================================= -->
  <!-- 第一次使用／註冊 -->
  <!-- ================================= -->

  <div id="registerPage" class="hidden">

    <div class="logo">
      群莘戰隊
    </div>

    <div class="subtitle">
      第一次使用
    </div>

    <div class="card">

      <div class="register-title">
        設定您的登入密碼
      </div>

      <div class="register-subtitle">
        請輸入您的 AG Code 與 Email。
        <br>
        系統會自動確認您的辦公室資料。
      </div>

      <input
        id="registerAgCode"
        type="text"
        inputmode="numeric"
        placeholder="請輸入 AG Code"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="請輸入 Email"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="請設定密碼"
      >

      <input
        id="registerPassword2"
        type="password"
        placeholder="請再次輸入密碼"
      >

      <button
        class="primary"
        onclick="registerUser()">
        完成設定
      </button>

      <button
        class="back-button"
        onclick="showLoginPage()">
        ← 返回登入
      </button>

      <div id="registerMessage"></div>

    </div>

  </div>


  <!-- ================================= -->
  <!-- 首頁 -->
  <!-- ================================= -->

  <div id="homePage" class="hidden">

    <div class="card">

      <div class="welcome">
        歡迎回來，
        <span id="userName"></span>
      </div>

      <div class="level">
        Lv.<span id="userLevel">1</span>
        ・ XP <span id="userXP">0</span>
      </div>

    </div>


    <!-- 今日活動 -->

    <div class="card">

      <h2>⚡ 快速活動</h2>

      <div class="activity-grid">

        <button
          class="activity"
          onclick="addActivity('約訪', 1)">
          約訪
          <span class="points">+1</span>
        </button>

        <button
          class="activity"
          onclick="addActivity('面談', 2)">
          面談
          <span class="points">+2</span>
        </button>

        <button
          class="activity"
          onclick="addActivity('遞送建議書', 3)">
          遞送建議書
          <span class="points">+3</span>
        </button>

        <button
          class="activity"
          onclick="addActivity('繳費', 4)">
          繳費
          <span class="points">+4</span>
        </button>

        <button
          class="activity"
          onclick="addActivity('簽收要保書', 5)">
          簽收要保書
          <span class="points">+5</span>
        </button>

      </div>

    </div>


    <!-- 戰隊功能 -->

    <div class="card">

      <h2>🏆 戰隊功能</h2>

      <button class="activity">
        🏆 排行榜
      </button>

      <button class="activity">
        🎯 任務
      </button>

      <button class="activity">
        🏅 徽章
      </button>

      <button class="activity">
        💬 研討
      </button>

      <button class="activity">
        👥 客戶
      </button>

    </div>


    <button
      class="logout"
      onclick="logout()">
      登出
    </button>

  </div>

</div>


<script>

/* =====================================================
   Supabase 設定
===================================================== */

const SUPABASE_URL =
  "https://frtrmqakzsawbzrtkdgp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_cBszHnxSkX5vGKnOZ9H1Kg_fmCMND0q";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   頁面切換
===================================================== */

function showLoginPage() {

  document
    .getElementById("registerPage")
    .classList.add("hidden");

  document
    .getElementById("homePage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


function showRegisterPage() {

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("homePage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.remove("hidden");

  document
    .getElementById("registerMessage")
    .textContent = "";

}


/* =====================================================
   登入
===================================================== */

async function login() {

  const agCode =
    document
      .getElementById("agCode")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document
      .getElementById("message");

  message.textContent = "";

  if (!agCode || !password) {

    message.textContent =
      "請輸入 AG Code 與密碼";

    return;
  }


  /* -------------------------------------
     先找 AG Code
  ------------------------------------- */

  const {
    data: allowedUser,
    error: allowedError
  } =
    await supabaseClient
      .from("allowed_ag_codes")
      .select("*")
      .eq("AGcode", agCode)
      .maybeSingle();


  if (allowedError) {

    message.textContent =
      "查詢 AG Code 失敗：" +
      allowedError.message;

    return;
  }


  if (!allowedUser) {

    message.textContent =
      "此 AG Code 尚未被允許使用";

    return;
  }


  if (allowedUser.enable === false) {

    message.textContent =
      "此 AG Code 目前未開放使用";

    return;
  }


  if (!allowedUser.email) {

    message.textContent =
      "此 AG Code 尚未設定 Email";

    return;
  }


  /* -------------------------------------
     使用資料庫中的 Email 登入
  ------------------------------------- */

  const email =
    allowedUser.email.trim().toLowerCase();


  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .signInWithPassword({

        email: email,

        password: password

      });


  if (error) {

    message.textContent =
      "登入失敗：" +
      "AG Code 或密碼錯誤";

    return;
  }


  await loadProfile(data.user.id);

}


/* =====================================================
   第一次使用／設定密碼
===================================================== */

async function registerUser() {

  const agCode =
    document
      .getElementById("registerAgCode")
      .value
      .trim();

  const emailInput =
    document
      .getElementById("registerEmail")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  const password2 =
    document
      .getElementById("registerPassword2")
      .value;

  const message =
    document
      .getElementById("registerMessage");

  message.textContent = "";


  /* -------------------------------------
     基本檢查
  ------------------------------------- */

  if (
    !agCode ||
    !emailInput ||
    !password ||
    !password2
  ) {

    message.textContent =
      "請完整填寫所有資料";

    return;
  }


  if (password.length < 6) {

    message.textContent =
      "密碼至少需要 6 個字元";

    return;
  }


  if (password !== password2) {

    message.textContent =
      "兩次輸入的密碼不一致";

    return;
  }


  /* -------------------------------------
     查詢 AG Code
  ------------------------------------- */

  const {
    data: allowedUser,
    error: allowedError
  } =
    await supabaseClient
      .from("allowed_ag_codes")
      .select("*")
      .eq("AGcode", agCode)
      .maybeSingle();


  if (allowedError) {

    message.textContent =
      "查詢 AG Code 失敗：" +
      allowedError.message;

    return;
  }


  if (!allowedUser) {

    message.textContent =
      "找不到此 AG Code，請確認輸入是否正確";

    return;
  }


  /* -------------------------------------
     是否啟用
  ------------------------------------- */

  if (allowedUser.enable === false) {

    message.textContent =
      "此 AG Code 目前未開放註冊";

    return;
  }


  /* -------------------------------------
     檢查 Email
  ------------------------------------- */

  if (!allowedUser.email) {

    message.textContent =
      "此 AG Code 尚未設定 Email，請聯絡管理員";

    return;
  }


  const registeredEmail =
    allowedUser.email
      .trim()
      .toLowerCase();


  if (registeredEmail !== emailInput) {

    message.textContent =
      "AG Code 與 Email 不符，請確認資料";

    return;
  }


  /* -------------------------------------
     是否已註冊
  ------------------------------------- */

  if (allowedUser.registered === true) {

    message.textContent =
      "此 AG Code 已完成註冊，請直接使用 AG Code＋密碼登入";

    return;
  }


  /* -------------------------------------
     建立 Supabase Auth 帳號
  ------------------------------------- */

  message.textContent =
    "正在建立帳號，請稍候...";


  const {
    data: signUpData,
    error: signUpError
  } =
    await supabaseClient
      .auth
      .signUp({

        email: registeredEmail,

        password: password

      });


  if (signUpError) {

    message.textContent =
      "建立帳號失敗：" +
      signUpError.message;

    return;
  }


  if (!signUpData.user) {

    message.textContent =
      "建立帳號失敗，請稍後再試";

    return;
  }


  const userId =
    signUpData.user.id;


  /* -------------------------------------
     建立 profiles
  ------------------------------------- */

  const {
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .insert({

        id: userId,

        name: allowedUser.name,

        level: 1,

        xp: 0

      });


  if (profileError) {

    message.textContent =
      "帳號已建立，但會員資料建立失敗：" +
      profileError.message;

    return;
  }


  /* -------------------------------------
     更新 registered
  ------------------------------------- */

  const {
    error: updateError
  } =
    await supabaseClient
      .from("allowed_ag_codes")
      .update({

        registered: true

      })
      .eq("AGcode", agCode);


  if (updateError) {

    message.textContent =
      "帳號已建立，但註冊狀態更新失敗：" +
      updateError.message;

    return;
  }


  /* -------------------------------------
     成功
  ------------------------------------- */

  if (signUpData.session) {

    message.textContent =
      "設定完成！正在進入群莘戰隊...";

    message.classList.add("success");

    await loadProfile(userId);

  } else {

    message.textContent =
      "設定完成！請至 Email 完成驗證後再登入。";

    message.classList.add("success");

  }

}


/* =====================================================
   讀取會員資料
===================================================== */

async function loadProfile(userId) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", userId)
      .single();


  if (error) {

    document
      .getElementById("message")
      .textContent =
      "找不到會員資料：" +
      error.message;

    return;
  }


  /* 隱藏登入／註冊 */

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("registerPage")
    .classList.add("hidden");


  /* 顯示首頁 */

  document
    .getElementById("homePage")
    .classList.remove("hidden");


  /* 填入會員資料 */

  document
    .getElementById("userName")
    .textContent =
      data.name || "";


  document
    .getElementById("userLevel")
    .textContent =
      data.level ?? 1;


  document
    .getElementById("userXP")
    .textContent =
      data.xp ?? 0;

}


/* =====================================================
   新增活動
===================================================== */

async function addActivity(type, points) {

  const {
    data: {
      user
    }
  } =
    await supabaseClient
      .auth
      .getUser();


  if (!user) {

    alert("請先登入");

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("activities")
      .insert({

        user_id: user.id,

        activity_type: type,

        points: points

      });


  if (error) {

    alert(
      "紀錄失敗：" +
      error.message
    );

    return;
  }


  alert(
    "完成「" +
    type +
    "」！\n獲得 +" +
    points +
    " XP"
  );


  await loadProfile(user.id);

}


/* =====================================================
   登出
===================================================== */

async function logout() {

  await supabaseClient
    .auth
    .signOut();


  document
    .getElementById("homePage")
    .classList.add("hidden");


  document
    .getElementById("loginPage")
    .classList.remove("hidden");


  document
    .getElementById("agCode")
    .value = "";


  document
    .getElementById("password")
    .value = "";


  document
    .getElementById("message")
    .textContent = "";

}


/* =====================================================
   自動登入
===================================================== */

async function checkSession() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (session) {

    await loadProfile(
      session.user.id
    );

  }

}


/* =====================================================
   監聽登入狀態
===================================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    async (event, session) => {

      if (
        event === "SIGNED_IN" &&
        session
      ) {

        await loadProfile(
          session.user.id
        );

      }

    }
  );


/* =====================================================
   啟動
===================================================== */

checkSession();

</script>

</body>
</html>

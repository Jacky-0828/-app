<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>群莘戰隊 App</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        sans-serif;

      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin: 20px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e8edf7;
      color: #172554;
    }

    .activity {
      background: #f0f4ff;
      color: #172554;
    }

    .logout {
      background: #eee;
      color: #333;
    }

    .hidden {
      display: none;
    }

    .welcome {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .level {
      color: #666;
      margin-bottom: 20px;
    }

    .activity-grid {
      display: grid;
      gap: 10px;
    }

    .points {
      float: right;
      font-weight: 800;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      color: #d33;
      min-height: 24px;
      line-height: 1.5;
    }

    .success {
      color: #16803c !important;
    }

    .small-text {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .setup-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .setup-info {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- ========================= -->
  <!-- 登入畫面 -->
  <!-- ========================= -->

  <div id="loginPage">

    <div class="logo">
      群莘戰隊
    </div>

    <div class="subtitle">
      南山人壽・業務活動管理
    </div>


    <div class="card">

      <input
        id="agCode"
        type="text"
        inputmode="numeric"
        placeholder="請輸入 AG Code"
      >


      <input
        id="password"
        type="password"
        placeholder="請輸入密碼"
      >


      <button
        class="primary"
        onclick="login()"
      >
        登入
      </button>


      <button
        class="secondary"
        onclick="showSetup()"
      >
        第一次使用／設定密碼
      </button>


      <div id="message"></div>


      <div class="small-text">
        第一次使用請先確認您的 AG Code
      </div>

    </div>

  </div>



  <!-- ========================= -->
  <!-- 第一次使用設定密碼 -->
  <!-- ========================= -->

  <div
    id="setupPage"
    class="hidden"
  >

    <div class="logo">
      群莘戰隊
    </div>

    <div class="subtitle">
      第一次使用設定
    </div>


    <div class="card">

      <div class="setup-title">
        設定您的登入密碼
      </div>


      <div class="setup-info">

        請輸入您的 AG Code。<br>
        系統會自動確認您的辦公室資料。<br>
        確認後即可自行設定密碼。

      </div>


      <input
        id="setupAgCode"
        type="text"
        inputmode="numeric"
        placeholder="請輸入 AG Code"
      >


      <input
        id="newPassword"
        type="password"
        placeholder="請設定密碼（至少 6 碼）"
      >


      <input
        id="confirmPassword"
        type="password"
        placeholder="請再次輸入密碼"
      >


      <button
        class="primary"
        onclick="setupPassword()"
      >
        設定密碼並開始使用
      </button>


      <button
        class="secondary"
        onclick="showLogin()"
      >
        返回登入
      </button>


      <div id="setupMessage"></div>

    </div>

  </div>



  <!-- ========================= -->
  <!-- 首頁 -->
  <!-- ========================= -->

  <div
    id="homePage"
    class="hidden"
  >


    <!-- 會員資訊 -->

    <div class="card">

      <div class="welcome">

        歡迎回來，
        <span id="userName"></span>

      </div>


      <div class="level">

        Lv.
        <span id="userLevel">1</span>

        ・ XP

        <span id="userXP">0</span>

      </div>

    </div>



    <!-- ========================= -->
    <!-- 今日活動 -->
    <!-- ========================= -->

    <div class="card">

      <h2>
        ⚡ 快速活動
      </h2>


      <div class="activity-grid">


        <button
          class="activity"
          onclick="addActivity('約訪', 1)"
        >

          約訪

          <span class="points">
            +1
          </span>

        </button>


        <button
          class="activity"
          onclick="addActivity('面談', 2)"
        >

          面談

          <span class="points">
            +2
          </span>

        </button>


        <button
          class="activity"
          onclick="addActivity('遞送建議書', 3)"
        >

          遞送建議書

          <span class="points">
            +3
          </span>

        </button>


        <button
          class="activity"
          onclick="addActivity('繳費', 4)"
        >

          繳費

          <span class="points">
            +4
          </span>

        </button>


        <button
          class="activity"
          onclick="addActivity('簽收要保書', 5)"
        >

          簽收要保書

          <span class="points">
            +5
          </span>

        </button>


      </div>

    </div>



    <!-- ========================= -->
    <!-- 戰隊功能 -->
    <!-- ========================= -->

    <div class="card">

      <h2>
        🏆 戰隊功能
      </h2>


      <button class="activity">
        🏆 排行榜
      </button>


      <button class="activity">
        🎯 任務
      </button>


      <button class="activity">
        🏅 徽章
      </button>


      <button class="activity">
        💬 研討
      </button>


      <button class="activity">
        👥 客戶
      </button>

    </div>



    <!-- 登出 -->

    <button
      class="logout"
      onclick="logout()"
    >
      登出
    </button>


  </div>


</div>



<script>


  // ==================================================
  // Supabase 設定
  // ==================================================

  const SUPABASE_URL =
    "https://frtrmqakzsawbzrtkdgp.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_cBszHnxSkX5vGKnOZ9H1Kg_fmCMND0q";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );



  // ==================================================
  // 顯示登入畫面
  // ==================================================

  function showLogin() {

    document
      .getElementById("setupPage")
      .classList.add("hidden");


    document
      .getElementById("homePage")
      .classList.add("hidden");


    document
      .getElementById("loginPage")
      .classList.remove("hidden");


    document
      .getElementById("message")
      .textContent = "";

  }



  // ==================================================
  // 顯示第一次設定畫面
  // ==================================================

  function showSetup() {

    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("homePage")
      .classList.add("hidden");


    document
      .getElementById("setupPage")
      .classList.remove("hidden");


    document
      .getElementById("setupMessage")
      .textContent = "";

  }



  // ==================================================
  // 尋找 AG Code
  // ==================================================

  async function findAGCode(agCode) {

    const {
      data,
      error
    } = await supabaseClient
      .from("allowed_ag_codes")
      .select("*")
      .eq("AGcode", agCode)
      .eq("enable", true)
      .maybeSingle();


    if (error) {

      console.error(error);

      throw new Error(
        "無法讀取 AG Code 資料：" +
        error.message
      );

    }


    if (!data) {

      throw new Error(
        "找不到此 AG Code，或此帳號尚未開通。"
      );

    }


    return data;

  }



  // ==================================================
  // 登入
  // ==================================================

  async function login() {


    const agCode =
      document
        .getElementById("agCode")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const message =
      document
        .getElementById("message");


    message.classList.remove("success");

    message.textContent = "";


    if (!agCode || !password) {

      message.textContent =
        "請輸入 AG Code 與密碼";

      return;

    }


    try {


      // 找 AG Code

      const member =
        await findAGCode(agCode);


      // 如果尚未完成第一次設定

      if (!member.registered) {

        message.textContent =
          "此 AG Code 尚未設定密碼，請先點選「第一次使用／設定密碼」。";

        return;

      }


      // 必須有 Email

      if (!member.email) {

        message.textContent =
          "此 AG Code 尚未設定 Email，請聯絡管理員。";

        return;

      }


      // 使用資料庫中的 Email 登入

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email: member.email,

            password: password

          });


      if (error) {

        message.textContent =
          "登入失敗：" +
          error.message;

        return;

      }


      // 載入會員資料

      await loadProfile(data.user.id);


    }

    catch (error) {

      message.textContent =
        error.message;

    }

  }



  // ==================================================
  // 第一次使用：設定密碼
  // ==================================================

  async function setupPassword() {


    const agCode =
      document
        .getElementById("setupAgCode")
        .value
        .trim();


    const newPassword =
      document
        .getElementById("newPassword")
        .value;


    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    const message =
      document
        .getElementById("setupMessage");


    message.classList.remove("success");

    message.textContent = "";


    // 基本檢查

    if (!agCode) {

      message.textContent =
        "請輸入 AG Code";

      return;

    }


    if (!newPassword) {

      message.textContent =
        "請設定密碼";

      return;

    }


    if (newPassword.length < 6) {

      message.textContent =
        "密碼至少需要 6 碼";

      return;

    }


    if (newPassword !== confirmPassword) {

      message.textContent =
        "兩次輸入的密碼不一致";

      return;

    }



    try {


      // 找會員資料

      const member =
        await findAGCode(agCode);


      // 已經註冊

      if (member.registered) {

        message.textContent =
          "此 AG Code 已完成設定，請直接返回登入。";

        return;

      }


      // 必須有 Email

      if (!member.email) {

        message.textContent =
          "此 AG Code 尚未設定 Email，請聯絡管理員。";

        return;

      }



      // ==================================================
      // 建立 Supabase Auth 帳號
      // ==================================================

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signUp({

            email: member.email,

            password: newPassword,

            options: {

              data: {

                ag_code: member.AGcode,

                name: member.name

              }

            }

          });


      if (error) {

        // 如果帳號已經存在

        if (
          error.message
            .toLowerCase()
            .includes("already registered")
        ) {

          message.textContent =
            "此 Email 已經有登入帳號，請直接使用登入功能。";

        }
        else {

          message.textContent =
            "建立帳號失敗：" +
            error.message;

        }

        return;

      }



      // ==================================================
      // 更新 registered = TRUE
      // ==================================================

      const {
        error: updateError
      } =
        await supabaseClient
          .from("allowed_ag_codes")
          .update({
            registered: true
          })
          .eq("AGcode", agCode);


      if (updateError) {

        console.error(updateError);

        message.textContent =
          "帳號建立成功，但會員狀態更新失敗：" +
          updateError.message;

        return;

      }



      // ==================================================
      // 判斷是否已經取得 Session
      // ==================================================

      if (data.session) {


        message.classList.add("success");

        message.textContent =
          "設定完成！正在進入群莘戰隊…";


        // 建立/載入會員資料

        await loadProfile(data.user.id);


      }
      else {


        message.classList.add("success");

        message.textContent =
          "密碼設定成功！請返回登入。";

      }


    }

    catch (error) {

      console.error(error);

      message.textContent =
        error.message;

    }

  }



  // ==================================================
  // 讀取會員資料
  // ==================================================

  async function loadProfile(userId) {


    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();


    if (error) {

      document
        .getElementById("message")
        .textContent =
          "讀取會員資料失敗：" +
          error.message;

      return;

    }


    // 如果 profiles 還沒有資料

    if (!data) {

      document
        .getElementById("message")
        .textContent =
          "找不到會員資料，請確認 profiles 資料表設定。";

      return;

    }



    // 隱藏登入/設定頁

    document
      .getElementById("loginPage")
      .classList.add("hidden");


    document
      .getElementById("setupPage")
      .classList.add("hidden");


    // 顯示首頁

    document
      .getElementById("homePage")
      .classList.remove("hidden");



    // 顯示會員資料

    document
      .getElementById("userName")
      .textContent =
        data.name || "";


    document
      .getElementById("userLevel")
      .textContent =
        data.level ?? 1;


    document
      .getElementById("userXP")
      .textContent =
        data.xp ?? 0;

  }



  // ==================================================
  // 新增活動
  // ==================================================

  async function addActivity(
    type,
    points
  ) {


    const {
      data: {
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    if (!user) {

      alert("請先登入");

      return;

    }



    const {
      error
    } =
      await supabaseClient
        .from("activities")
        .insert({

          user_id:
            user.id,

          activity_type:
            type,

          points:
            points

        });


    if (error) {

      alert(
        "紀錄失敗：" +
        error.message
      );

      return;

    }


    alert(
      "完成「" +
      type +
      "」！\n獲得 +" +
      points +
      " XP"
    );


    await loadProfile(
      user.id
    );

  }



  // ==================================================
  // 登出
  // ==================================================

  async function logout() {


    await supabaseClient
      .auth
      .signOut();


    document
      .getElementById("homePage")
      .classList.add("hidden");


    document
      .getElementById("loginPage")
      .classList.remove("hidden");


    document
      .getElementById("agCode")
      .value = "";


    document
      .getElementById("password")
      .value = "";


    document
      .getElementById("message")
      .textContent = "";

  }



  // ==================================================
  // 自動檢查登入狀態
  // ==================================================

  async function checkSession() {


    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (session) {

      await loadProfile(
        session.user.id
      );

    }

  }



  // ==================================================
  // 啟動 App
  // ==================================================

  checkSession();


</script>


</body>

</html>

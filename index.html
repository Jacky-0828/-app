<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>群莘戰隊</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
  "PingFang TC","Microsoft JhengHei",sans-serif;
  background:#f5f7fb;
  color:#111827;
}

button,input,textarea,select{
  font-family:inherit;
}

.page{
  min-height:100vh;
  padding:40px 18px;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:28px;
}

.header h1{
  margin:0;
  font-size:38px;
  font-weight:800;
}

.header p{
  margin:10px 0 0;
  color:#777;
  font-size:18px;
}

.card{
  background:white;
  border-radius:24px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

input,textarea,select{
  width:100%;
  border:2px solid #e2e2e2;
  border-radius:15px;
  padding:15px;
  font-size:17px;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#172033;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.field{
  margin-bottom:14px;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:10px;
}

.primary{
  background:#111827;
  color:white;
}

.secondary{
  background:#e9eef8;
  color:#172957;
}

.light{
  background:#f1f3f7;
  color:#333;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.hidden{
  display:none!important;
}

.message{
  text-align:center;
  margin-top:15px;
  line-height:1.5;
}

.error{
  color:#d84035;
}

.success{
  color:#159447;
}

.info{
  color:#666;
}

.section-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:16px;
}

.welcome{
  font-size:28px;
  font-weight:800;
}

.sub{
  color:#777;
  margin-top:5px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:20px;
}

.stat{
  background:#f5f7fb;
  border-radius:18px;
  padding:15px 8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:24px;
}

.stat span{
  font-size:14px;
  color:#777;
}

.activity-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.activity{
  background:#eef3ff;
  color:#172957;
  margin:0;
}

.activity small{
  display:block;
  margin-top:5px;
  opacity:.7;
}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.menu-btn{
  background:#f5f7fb;
  color:#222;
  min-height:70px;
}

.list-item{
  background:#f7f8fa;
  border-radius:16px;
  padding:16px;
  margin-bottom:10px;
}

.list-item:last-child{
  margin-bottom:0;
}

.list-title{
  font-size:18px;
  font-weight:800;
}

.list-sub{
  color:#777;
  margin-top:5px;
  line-height:1.5;
}

.customer-card{
  background:#f8f9fc;
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
}

.customer-name{
  font-size:21px;
  font-weight:800;
}

.customer-tag{
  display:inline-block;
  background:#e8eefc;
  color:#28447c;
  padding:4px 9px;
  border-radius:20px;
  font-size:13px;
  margin-top:7px;
}

.customer-money{
  font-size:19px;
  font-weight:700;
  margin-top:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.back{
  background:transparent;
  color:#777;
}

.small-btn{
  width:auto;
  padding:9px 14px;
  font-size:14px;
  margin:0;
}

.label{
  font-size:14px;
  color:#777;
  margin-bottom:6px;
  display:block;
}

.info-row{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.info-row:last-child{
  border-bottom:0;
}

.rank{
  font-size:20px;
  font-weight:800;
}

.empty{
  text-align:center;
  color:#888;
  padding:25px 10px;
}

.loading{
  opacity:.6;
  pointer-events:none;
}

@media(max-width:480px){

  .page{
    padding:25px 14px 40px;
  }

  .header h1{
    font-size:32px;
  }

  .card{
    padding:20px;
  }

  .activity-grid,
  .menu-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="page">
<div class="container">

<!-- ================================================= -->
<!-- 登入 -->
<!-- ================================================= -->

<div id="loginPage">

  <div class="header">
    <h1>群莘戰隊</h1>
    <p>南山人壽・業務活動管理</p>
  </div>

  <div class="card">

    <div class="field">
      <input id="loginAgcode"
             placeholder="請輸入 AG Code"
             autocomplete="username">
    </div>

    <div class="field">
      <input id="loginPassword"
             type="password"
             placeholder="請輸入密碼"
             autocomplete="current-password">
    </div>

    <button class="primary" onclick="login()">
      登入
    </button>

    <button class="secondary" onclick="showSetup()">
      第一次使用 / 設定密碼
    </button>

    <div id="loginMessage" class="message"></div>

  </div>
</div>


<!-- ================================================= -->
<!-- 第一次使用 -->
<!-- ================================================= -->

<div id="setupPage" class="hidden">

  <div class="header">
    <h1>群莘戰隊</h1>
    <p>第一次使用</p>
  </div>

  <div class="card">

    <div class="section-title">
      設定您的登入密碼
    </div>

    <p class="sub">
      請輸入辦公室提供的 AG Code 與 Email。
      系統會自動確認您的資料。
    </p>

    <div class="field">
      <label class="label">AG Code</label>
      <input id="setupAgcode"
             placeholder="請輸入 AG Code">
    </div>

    <div class="field">
      <label class="label">Email</label>
      <input id="setupEmail"
             type="email"
             placeholder="請輸入 Email">
    </div>

    <div class="field">
      <label class="label">設定密碼</label>
      <input id="setupPassword"
             type="password"
             placeholder="至少 6 碼">
    </div>

    <div class="field">
      <label class="label">再次輸入密碼</label>
      <input id="setupPassword2"
             type="password"
             placeholder="再次輸入密碼">
    </div>

    <button id="setupButton"
            class="primary"
            onclick="setupAccount()">
      完成設定
    </button>

    <button class="back"
            onclick="showLogin()">
      ← 返回登入
    </button>

    <div id="setupMessage" class="message"></div>

  </div>
</div>


<!-- ================================================= -->
<!-- 首頁 -->
<!-- ================================================= -->

<div id="homePage" class="hidden">

  <div class="header">
    <h1>群莘戰隊</h1>
    <p>南山人壽・業務活動管理</p>
  </div>

  <div class="card">

    <div class="welcome">
      歡迎回來，<span id="homeName"></span>
    </div>

    <div class="sub">
      AG Code：<span id="homeAgcode"></span>
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="homeLevel">1</strong>
        <span>等級</span>
      </div>

      <div class="stat">
        <strong id="homeXP">0</strong>
        <span>XP</span>
      </div>

      <div class="stat">
        <strong id="homeCustomers">0</strong>
        <span>準客戶</span>
      </div>

    </div>

  </div>


  <!-- 快速活動 -->

  <div class="card">

    <div class="section-title">
      ⚡ 今日活動
    </div>

    <div class="activity-grid">

      <button class="activity"
              onclick="addActivity('約訪',1)">
        📞 約訪
        <small>+1 XP</small>
      </button>

      <button class="activity"
              onclick="addActivity('面談',2)">
        🤝 面談
        <small>+2 XP</small>
      </button>

      <button class="activity"
              onclick="addActivity('遞送建議書',3)">
        📄 遞送建議書
        <small>+3 XP</small>
      </button>

      <button class="activity"
              onclick="addActivity('繳費',4)">
        💰 繳費
        <small>+4 XP</small>
      </button>

      <button class="activity"
              onclick="addActivity('簽收要保書',5)">
        ✍️ 簽收要保書
        <small>+5 XP</small>
      </button>

    </div>

  </div>


  <!-- 功能 -->

  <div class="card">

    <div class="section-title">
      🏆 戰隊功能
    </div>

    <div class="menu-grid">

      <button class="menu-btn"
              onclick="showActivities()">
        📊
        <br>
        我的紀錄
      </button>

      <button class="menu-btn"
              onclick="showRanking()">
        🏆
        <br>
        排行榜
      </button>

      <button class="menu-btn"
              onclick="showCustomers()">
        👥
        <br>
        準客戶
      </button>

      <button class="menu-btn"
              onclick="showDiscussion()">
        💬
        <br>
        研討
      </button>

    </div>

  </div>

  <button class="danger"
          onclick="logout()">
    登出
  </button>

</div>


<!-- ================================================= -->
<!-- 活動紀錄 -->
<!-- ================================================= -->

<div id="activityPage" class="hidden">

  <div class="header">
    <h1>我的活動</h1>
    <p>近期業務活動紀錄</p>
  </div>

  <div class="card">

    <button class="back"
            onclick="showHome()">
      ← 返回首頁
    </button>

    <div id="activityList"></div>

  </div>

</div>


<!-- ================================================= -->
<!-- 排行榜 -->
<!-- ================================================= -->

<div id="rankingPage" class="hidden">

  <div class="header">
    <h1>🏆 排行榜</h1>
    <p>群莘戰隊 XP 排名</p>
  </div>

  <div class="card">

    <button class="back"
            onclick="showHome()">
      ← 返回首頁
    </button>

    <div id="rankingList"></div>

  </div>

</div>


<!-- ================================================= -->
<!-- 客戶列表 -->
<!-- ================================================= -->

<div id="customerPage" class="hidden">

  <div class="header">
    <h1>👥 準客戶</h1>
    <p>管理你的準客戶</p>
  </div>

  <div class="card">

    <button class="back"

      ← 返回首頁
    </button>

    <button class="primary"

    </button>

<!-- 客戶編輯 -->

<!-- ================================================= -->

    <p>群莘戰隊交流區</p>
  </div>

            onclick="showHome()">
      ← 返回首頁
    </button>

    <div class="field">

  </div>

  </div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://frtrmqakzsawbzrtkdgp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cBszHnxSkX5vGKnOZ9H1Kg_fmCMND0q";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      autoRefreshToken:true,
      persistSession:true,
      detectSessionInUrl:true
    }
  }
);


/* =====================================================
   工具
===================================================== */

function clean(v){
  return String(v || "").trim();
}

function emailClean(v){
  return clean(v).toLowerCase();
}

function escapeHtml(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function message(id,text,type="error"){
  const el=document.getElementById(id);
  el.textContent=text;
  el.className="message "+type;
}


/* =====================================================
   隱藏所有頁面
===================================================== */

function hideAll(){

  [
    "loginPage",
    "setupPage",
    "homePage",
    "activityPage",
    "rankingPage",
    "customerPage",
    "customerEditPage",
    "discussionPage"
  ].forEach(id=>{
    document.getElementById(id)
      .classList.add("hidden");
  });

}


/* =====================================================
   頁面
===================================================== */

function showLogin(){

  hideAll();

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}

function showSetup(){

  hideAll();

  document
    .getElementById("setupPage")
    .classList.remove("hidden");

}

function showHome(){

  hideAll();

  document
    .getElementById("homePage")
    .classList.remove("hidden");

  loadHome();

}


/* =====================================================
   第一次設定密碼
===================================================== */

async function setupAccount(){

  const agcode=
    clean(document.getElementById("setupAgcode").value);

  const email=
    emailClean(document.getElementById("setupEmail").value);

  const password=
    document.getElementById("setupPassword").value;

  const password2=
    document.getElementById("setupPassword2").value;

  if(!agcode)
    return message("setupMessage","請輸入 AG Code");

  if(!email)
    return message("setupMessage","請輸入 Email");

  if(password.length<6)
    return message("setupMessage","密碼至少 6 碼");

  if(password!==password2)
    return message("setupMessage","兩次密碼不一致");


  const button=
    document.getElementById("setupButton");

  button.classList.add("loading");
  button.textContent="確認資料中...";


  try{

    const {data,error}=await supabaseClient
      .from("allowed_ag_codes")
      .select("AGcode,name,email,enable,registered")
      .eq("AGcode",agcode)
      .maybeSingle();

    if(error)
      throw error;

    if(!data)
      throw new Error("找不到此 AG Code");

    if(data.enable===false)
      throw new Error("此 AG Code 尚未啟用");

    if(emailClean(data.email)!==email)
      throw new Error("AG Code 與 Email 不符合");

    if(data.registered===true)
      throw new Error("此 AG Code 已完成設定，請直接登入");


    button.textContent="建立帳號...";


    const {data:authData,error:authError}
      =await supabaseClient.auth.signUp({

      email,
      password,

      options:{
        data:{
          agcode,
          name:data.name
        }
      }

    });


    if(authError)
      throw authError;

    if(!authData.user)
      throw new Error("帳號建立失敗");


    /*
      如果 Supabase 開啟 Email Confirmation，
      session 可能是 null。
    */

    if(!authData.session){

      message(
        "setupMessage",
        "帳號已建立，請先到 Email 完成驗證後再登入。",
        "success"
      );

      button.classList.remove("loading");
      button.textContent="完成設定";

      return;
    }


    /*
      建立 profiles
    */

    const {error:profileError}
      =await supabaseClient
      .from("profiles")
      .insert({

        id:authData.user.id,
        agcode,
        name:data.name,
        email,
        level:1,
        xp:0

      });


    if(profileError)
      throw profileError;


    /*
      標記已註冊
    */

    await supabaseClient
      .from("allowed_ag_codes")
      .update({
        registered:true
      })
      .eq("AGcode",agcode);


    message(
      "setupMessage",
      "設定完成！正在登入...",
      "success"
    );


    setTimeout(()=>{
      loadHome();
    },700);


  }catch(err){

    console.error(err);

    message(
      "setupMessage",
      err.message || "設定失敗"
    );

  }finally{

    button.classList.remove("loading");
    button.textContent="完成設定";

  }

}


/* =====================================================
   登入
===================================================== */

async function login(){

  const agcode=
    clean(document.getElementById("loginAgcode").value);

  const password=
    document.getElementById("loginPassword").value;


  if(!agcode)
    return message("loginMessage","請輸入 AG Code");

  if(!password)
    return message("loginMessage","請輸入密碼");


  const button=
    document.getElementById("loginButton");

  button.classList.add("loading");
  button.textContent="登入中...";


  try{

    /*
      AG Code → Email
    */

    const {data,error}=await supabaseClient
      .from("allowed_ag_codes")
      .select("AGcode,name,email,enable")
      .eq("AGcode",agcode)
      .maybeSingle();


    if(error)
      throw error;

    if(!data)
      throw new Error("找不到此 AG Code");

    if(data.enable===false)
      throw new Error("此 AG Code 尚未啟用");

    const email=
      emailClean(data.email);

    if(!email)
      throw new Error("此 AG Code 沒有 Email");


    /*
      Email + Password
    */

    const {error:loginError}
      =await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });


    if(loginError)
      throw new Error(
        "登入失敗，請確認 AG Code 或密碼"
      );


    await loadHome();


  }catch(err){

    console.error(err);

    message(
      "loginMessage",
      err.message || "登入失敗"
    );

  }finally{

    button.classList.remove("loading");
    button.textContent="登入";

  }

}


/* =====================================================
   首頁
===================================================== */

async function loadHome(){

  try{

    const {
      data:{user}
    }=await supabaseClient.auth.getUser();

    if(!user){
      showLogin();
      return;
    }


    const {data:profile,error}=await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


    if(error)
      throw error;

    if(!profile)
      throw new Error("找不到會員資料");


    document.getElementById("homeName")
      .textContent=profile.name || "會員";

    document.getElementById("homeAgcode")
      .textContent=profile.agcode || "";

    document.getElementById("homeLevel")
      .textContent=profile.level ?? 1;

    document.getElementById("homeXP")
      .textContent=profile.xp ?? 0;


    /*
      客戶數
    */

    const {count}=await supabaseClient
      .from("customers")
      .select("*",{count:"exact",head:true})
      .eq("user_id",user.id);

    document.getElementById("homeCustomers")
      .textContent=count || 0;


    hideAll();

    document.getElementById("homePage")
      .classList.remove("hidden");


  }catch(err){

    console.error(err);

    await supabaseClient.auth.signOut();

    showLogin();

    message(
      "loginMessage",
      err.message || "載入會員資料失敗"
    );

  }

}


/* =====================================================
   新增活動
===================================================== */

async function addActivity(type,points){

  const {
    data:{user}
  }=await supabaseClient.auth.getUser();

  if(!user)
    return showLogin();


  /*
    活動
  */

  const {error}=await supabaseClient
    .from("activities")
    .insert({

      user_id:user.id,
      activity_type:type,
      points

    });


  if(error){

    alert("活動紀錄失敗："+error.message);

    return;

  }


  /*
    取得目前 XP
  */

  const {data:profile}=await supabaseClient
    .from("profiles")
    .select("xp,level")
    .eq("id",user.id)
    .maybeSingle();


  const newXP=(profile?.xp || 0)+points;

  /*
    每 100 XP 升一級
  */

  const newLevel=
    Math.floor(newXP/100)+1;


  await supabaseClient
    .from("profiles")
    .update({

      xp:newXP,
      level:newLevel

    })
    .eq("id",user.id);


  alert(
    `完成「${type}」！\n獲得 +${points} XP`
  );


  loadHome();

}

/* =====================================================

===================================================== */

async function editCustomer(id){

  const {data,error}=await supabaseClient
    .from("customers")
    .select("*")
    .eq("id",id)
    .maybeSingle();


  if(error || !data){

    alert(
      error?.message || "找不到客戶"
    );

    return;

  }


  hideAll();

  document.getElementById("customerEditPage")
    .classList.remove("hidden");


  document.getElementById("customerId").value=data.id;

  document.getElementById("customerName").value=data.name || "";

  document.getElementById("customerPhone").value=data.phone || "";

  document.getElementById("customerEmail").value=data.email || "";

  document.getElementById("customerRelation").value=data.relation || "";

  document.getElementById("customerRelationNote").value=
    data.relation_note || "";

  document.getElementById("customerNeed").value=
    data.need || "";

  document.getElementById("customerProduct").value=
    data.product || "";

  document.getElementById("customerAmount").value=
    data.amount || "";

  document.getElementById("customerDate").value=
    data.expected_date || "";

  document.getElementById("customerProbability").value=
    data.probability || 60;

  document.getElementById("customerNextAction").value=
    data.next_action || "";

  document.getElementById("customerNote").value=
    data.note || "";


  document.getElementById("interactionCard")
    .classList.remove("hidden");


  loadInteractions(id);

}


/* =====================================================
   儲存客戶
===================================================== */

async function saveCustomer(){

  const {
    data:{user}
  }=await supabaseClient.auth.getUser();


  if(!user)
    return showLogin();


  const id=
    clean(document.getElementById("customerId").value);


  const customer={

    user_id:user.id,

    name:clean(
      document.getElementById("customerName").value
    ),

    phone:clean(
      document.getElementById("customerPhone").value
    ),

    email:emailClean(
      document.getElementById("customerEmail").value
    ),

    relation:clean(
      document.getElementById("customerRelation").value
    ),

    relation_note:clean(
      document.getElementById("customerRelationNote").value
    ),

    need:clean(
      document.getElementById("customerNeed").value
    ),

    product:clean(
      document.getElementById("customerProduct").value
    ),

    amount:
      Number(
        document.getElementById("customerAmount").value
      ) || 0,

    expected_date:
      document.getElementById("customerDate").value || null,

    probability:
      Number(
        document.getElementById("customerProbability").value
      ) || 0,

    next_action:clean(
      document.getElementById("customerNextAction").value
    ),

    note:clean(
      document.getElementById("customerNote").value
    )

  };


  if(!customer.name){

    return message(
      "customerMessage",
      "請輸入客戶姓名"
    );

  }


  let error;


  if(id){

    const result=
      await supabaseClient
      .from("customers")
      .update(customer)
      .eq("id",id)
      .eq("user_id",user.id);

    error=result.error;

  }else{

    const result=
      await supabaseClient
      .from("customers")
      .insert(customer);

    error=result.error;

  }


  if(error){

    console.error(error);

    return message(
      "customerMessage",
      "儲存失敗："+error.message
    );

  }


  message(
    "customerMessage",
    "客戶資料已儲存",
    "success"
  );


  setTimeout(()=>{
    showCustomers();
  },600);

}

async function deleteCustomer(){

  const id=
    clean(document.getElementById("customerId").value);


  if(!id){

    showCustomers();

    return;

  }


  if(!confirm("確定要刪除這位客戶嗎？"))
    return;


  const {error}=await supabaseClient
    .from("customers")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "刪除失敗："+error.message
    );

    return;

  }


  showCustomers();

}

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>群莘戰隊 App</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        sans-serif;

      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin: 20px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #eef2f7;
      color: #111827;
    }

    .activity {
      background: #f0f4ff;
      color: #172554;
    }

    .logout {
      background: #eee;
      color: #333;
    }

    .hidden {
      display: none;
    }

    .welcome {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .level {
      color: #666;
      margin-bottom: 20px;
    }

    .activity-grid {
      display: grid;
      gap: 10px;
    }

    .points {
      float: right;
      font-weight: 800;
    }

    #message,
    #setupMessage {
      text-align: center;
      margin: 15px 0;
      color: #d33;
      min-height: 24px;
    }

    .info {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .back {
      background: transparent;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">


  <!-- ========================= -->
  <!-- 登入畫面 -->
  <!-- ========================= -->

  <div id="loginPage">

    <div class="logo">
      群莘戰隊
    </div>

    <div class="subtitle">
      南山人壽・業務活動管理
    </div>

    <div class="card">

      <input
        id="agCode"
        type="text"
        placeholder="請輸入 AG Code"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="請輸入密碼"
        autocomplete="current-password"
      >

      <button
        class="primary"
        onclick="login()"
      >
        登入
      </button>

      <button
        class="secondary"
        onclick="showSetupPage()"
      >
        第一次使用／設定密碼
      </button>

      <div id="message"></div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- 第一次設定密碼 -->
  <!-- ========================= -->

  <div id="setupPage" class="hidden">

    <div class="logo">
      群莘戰隊
    </div>

    <div class="subtitle">
      第一次使用
    </div>

    <div class="card">

      <h2>
        設定你的登入密碼
      </h2>

      <div class="info">
        請輸入你的 AG Code，
        然後設定自己的密碼。
      </div>

      <input
        id="setupAgCode"
        type="text"
        placeholder="請輸入 AG Code"
        autocomplete="username"
      >

      <input
        id="setupPassword"
        type="password"
        placeholder="請設定密碼"
        autocomplete="new-password"
      >

      <input
        id="setupPassword2"
        type="password"
        placeholder="再次輸入密碼"
        autocomplete="new-password"
      >

      <button
        class="primary"
        onclick="setupPassword()"
      >
        完成設定
      </button>

      <button
        class="back"
        onclick="showLoginPage()"
      >
        ← 返回登入
      </button>

      <div id="setupMessage"></div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- 首頁 -->
  <!-- ========================= -->

  <div id="homePage" class="hidden">

    <div class="card">

      <div class="welcome">
        歡迎回來，
        <span id="userName"></span>
      </div>

      <div class="level">
        Lv.<span id="userLevel">1</span>
        ・ XP <span id="userXP">0</span>
      </div>

    </div>


    <!-- 今日活動 -->

    <div class="card">

      <h2>
        ⚡ 快速活動
      </h2>

      <div class="activity-grid">

        <button
          class="activity"
          onclick="addActivity('約訪', 1)"
        >
          約訪
          <span class="points">
            +1
          </span>
        </button>

        <button
          class="activity"
          onclick="addActivity('面談', 2)"
        >
          面談
          <span class="points">
            +2
          </span>
        </button>

        <button
          class="activity"
          onclick="addActivity('遞送建議書', 3)"
        >
          遞送建議書
          <span class="points">
            +3
          </span>
        </button>

        <button
          class="activity"
          onclick="addActivity('繳費', 4)"
        >
          繳費
          <span class="points">
            +4
          </span>
        </button>

        <button
          class="activity"
          onclick="addActivity('簽收要保書', 5)"
        >
          簽收要保書
          <span class="points">
            +5
          </span>
        </button>

      </div>

    </div>


    <!-- 戰隊功能 -->

    <div class="card">

      <h2>
        🏆 戰隊功能
      </h2>

      <button class="activity">
        🏆 排行榜
      </button>

      <button class="activity">
        🎯 任務
      </button>

      <button class="activity">
        🏅 徽章
      </button>

      <button class="activity">
        💬 研討
      </button>

      <button class="activity">
        👥 客戶
      </button>

    </div>


    <button
      class="logout"
      onclick="logout()"
    >
      登出
    </button>

  </div>

</div>


<script>


  // =========================================
  // Supabase 設定
  // =========================================

  const SUPABASE_URL =
    "https://frtrmqakzsawbzrtkdgp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_cBszHnxSkX5vGKnOZ9H1Kg_fmCMND0q";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================================
  // 頁面切換
  // =========================================

  function showLoginPage() {

    document
      .getElementById("setupPage")
      .classList.add("hidden");

    document
      .getElementById("homePage")
      .classList.add("hidden");

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

  }


  function showSetupPage() {

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("homePage")
      .classList.add("hidden");

    document
      .getElementById("setupPage")
      .classList.remove("hidden");

    document
      .getElementById("setupMessage")
      .textContent = "";

  }


  // =========================================
  // 第一次設定密碼
  // =========================================

  async function setupPassword() {

    const agCode =
      document
        .getElementById("setupAgCode")
        .value
        .trim();

    const password =
      document
        .getElementById("setupPassword")
        .value;

    const password2 =
      document
        .getElementById("setupPassword2")
        .value;

    const message =
      document
        .getElementById("setupMessage");


    message.textContent = "";


    // 檢查 AG Code

    if (!agCode) {

      message.textContent =
        "請輸入 AG Code";

      return;
    }


    // 檢查密碼

    if (!password || !password2) {

      message.textContent =
        "請輸入兩次密碼";

      return;
    }


    if (password.length < 6) {

      message.textContent =
        "密碼至少需要 6 碼";

      return;
    }


    if (password !== password2) {

      message.textContent =
        "兩次密碼不一致";

      return;
    }


    message.textContent =
      "正在確認 AG Code...";


    // =====================================
    // 檢查 AG Code 是否在允許名單
    // =====================================

    const {
      data: allowed,
      error: allowedError
    } =
      await supabaseClient
        .from("allowed_ag_codes")
        .select("*")
        .eq("AGcode", agCode)
        .single();


    if (allowedError || !allowed) {

      message.textContent =
        "此 AG Code 尚未被允許使用";

      return;
    }


    // =====================================
    // 找出對應 Email
    // =====================================

    let email =
      allowed.email;


    /*
      如果資料表沒有 email，
      就使用 AG Code 組成系統 Email。

      例如：

      200039990
      ↓
      200039990@qunxin.app
    */

    if (!email) {

      email =
        agCode + "@qunxin.app";

    }


    message.textContent =
      "正在建立帳號...";


    // =====================================
    // 建立 Supabase Auth 帳號
    // =====================================

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password

      });


    if (error) {

      // 如果帳號已經存在
      // 表示之前可能已經設定過密碼

      if (
        error.message
          .toLowerCase()
          .includes("already registered")
      ) {

        message.textContent =
          "這個 AG Code 已經設定過密碼，請直接登入。";

        return;

      }


      message.textContent =
        "設定失敗：" +
        error.message;

      return;

    }


    // =====================================
    // 設定成功
    // =====================================

    message.textContent =
      "密碼設定成功！正在登入...";


    // Supabase 有 Session
    // 就直接進入首頁

    if (data.session) {

      await loadProfile(
        data.session.user.id
      );

      return;

    }


    // 如果需要 Email 驗證

    message.textContent =
      "密碼已設定，請確認 Email 後再登入。";

  }


  // =========================================
  // 登入
  // =========================================

  async function login() {

    const agCode =
      document
        .getElementById("agCode")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const message =
      document
        .getElementById("message");


    message.textContent = "";


    if (!agCode || !password) {

      message.textContent =
        "請輸入 AG Code 與密碼";

      return;

    }


    message.textContent =
      "登入中...";


    // =====================================
    // 先確認 AG Code 是否存在
    // =====================================

    const {
      data: allowed,
      error: allowedError
    } =
      await supabaseClient
        .from("allowed_ag_codes")
        .select("*")
        .eq("AGcode", agCode)
        .single();


    if (allowedError || !allowed) {

      message.textContent =
        "此 AG Code 尚未被允許使用";

      return;

    }


    // =====================================
    // 取得 Email
    // =====================================

    let email =
      allowed.email;


    if (!email) {

      email =
        agCode + "@qunxin.app";

    }


    // =====================================
    // Supabase 登入
    // =====================================

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


    if (error) {

      message.textContent =
        "登入失敗：密碼錯誤或帳號尚未設定";

      return;

    }


    // =====================================
    // 載入
